title: WZNAWIAMY NABÓR DO GRUPY TUS DLA DZIECI  7-8 L.
date: 2026-08-24T18:21:46.391Z
body: >-
  <!--StartFragment-->


  W związku z wieloma zapytaniami o grupy Treningu Umiejętności Społecznych, postanowiliśmy wznowić nabór do kameralnej, 4-6 osobowej, grupy dla dzieci w wieku 7-8 l. Zajęcia poprowadzi p. Magdalena Michnowicz - psycholog, dyplomowana trenerka TUS i socjoterapeutka.


  Celem zajęć jest rozwój kompetencji społecznych oraz wzmocnienie poczucia własnej wartości. W formie dostosowanej do etapu rozwojowego dzieci będą mogły przećwiczyć kluczowe umiejętności niezbędne do nawiązywania relacji z rówieśnikami tj, inicjowanie rozmowy, stawanie granic, nazywanie i regulacja emocji, postawa empatii, świadomość swoich mocnych stron.


  Zajęcia odbywać się będą w czwartki o godz .18.00 w gabinecie na Osiedlu Centrum B 11/93.


  Udział w grupie poprzedzony jest konsultacją wstępną. Zapisów na konsultacje dokonywać można mailowo - pracownia.drabina@gmail.com oraz telefonicznie [506 963 634](https://l.facebook.com/l.php?u=https%3A%2F%2Fapi.whatsapp.com%2Fsend%3Fphone%3D48506963634%26token%3DeyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6IjEyNSJ9.eyJleHAiOjE3ODc2ODE5NTgsInBob25lIjoiNDg1MDY5NjM2MzQiLCJ0ZXh0IjoiTGluazpcbmh0dHBzOlwvXC9mYi5tZVwvNm91ZkZzRjNiXG5cblpvYmFjenlcdTAxNDJlbShhbSkgdG8gbmEgRmFjZWJvb2t1Li4uIiwiYXBwIjoiZmFjZWJvb2sifQ.7r0tsBnMTPCX9mxl2C59qqgQjzr6YkLk4oRzdukIZOIdqPS_g2dFGKFmbVLo4rumisVxK_KtvCZbeBFx669q0w%26fbclid%3DIwcGRvZgFleHRuA2FlbQIxMABicmlkETBNS1lzejdEUkNadTlkYzk0c3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHqiA1xzhu7Xuj8mvKtf7Qp-RpcHq83f1IRMvcYEE6G9HIsrFfKD5Yr-0wKiR_aem_MNo5tW2bUH3LQoFlC-B6CQ&h=AUCIvWDSLW_bAbyrFpRtp0tyF1LBZpGVOHqqeNeIrhS-MD8seDwhBbNn7hqivpRAHpDmBVzQbYRGBRIcRKreKuYwGLzsLvfi3fiR6sG60SXGu6cs8MgsE96YXADJIHCs3D_brc89yk48wwDEbfWLsw&__tn__=-UK-R&c[0]=AUDMlKuvhTGip8h_WlMsYcMk-nfs9CIWwV-IDLOsDmpwwVuXOMhaLZYxwOAxFHTtL_yhMKBnnCrlFLtpa8W7NbLeL6YTjA9CWmvOtfgTVNzSXu7UUSYx6hU6UJfYYxGZ5rFzPaUVM1q6MVo8ae_IsWfeFPh6kiwuFWAKddye9w)


