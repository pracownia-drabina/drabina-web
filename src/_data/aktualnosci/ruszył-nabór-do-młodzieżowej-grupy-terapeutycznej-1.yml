title: Ruszył nabór do młodzieżowej grupy terapeutycznej
date: 2026-08-06T10:54:36.823Z
body: >-
  <!--StartFragment-->


  Zgodnie z obietnicą - ogłaszamy nabór do pierwszej grupy terapeutycznej.


  Od października ruszy grupa terapeutyczna dla młodzieży w wieku 15-18, która doświadcza trudności w relacjach z rówieśnikami, przeżywa kryzysy emocjonalne, zmaga się z lękiem, obniżonym nastrojem lub trudnościami w zrozumieniu własnych potrzeb.


  Jak pracujemy?


  Spotkania odbywać się będą raz w tygodniu na 90 minut w grupie 8–10 osób od października 2026 roku do czerwca 2027 roku.


  Proces poprowadzą dwie psychoterapeutki - Aleksandra Kondraciuk i Katarzyna Szczepaniec-Gracz.


  Koszt jednego spotkania: 150 zł


  Uczestnictwo w grupie poprzedza konsultacja kwalifikacyjna z nastolatkiem oraz jego rodzicami/opiekunami.


  Celem terapii jest:


  ● odkrywanie i zrozumienie siebie bez krytyki, presji i oceny;


  ● budowanie stabilnego poczucie własnej wartości;


  ● nauka radzenia sobie ze stresem i emocjami;


  ● nawiązanie ważnych relacji z ludźmi w tym samym wieku


  Zapewniamy bezpieczne, sprzyjające środowisko, dzięki obowiązującej zasadzie poufności - wszystko, o czym rozmawiamy na grupie, zostaje między nami.


  Zapisów na konsultacje wstępne dokonywać można drogą mailową - pracownia.drabina@gmail.com oraz telefonicznie - [506 963 634](https://api.whatsapp.com/send?phone=48506963634&token=eyJhbGciOiJFUzI1NiIsInR5cCI6IkpXVCIsImtpZCI6IjEyNSJ9.eyJleHAiOjE3ODYwOTk5MDcsInBob25lIjoiNDg1MDY5NjM2MzQiLCJ0ZXh0IjoiTGluazpcbmh0dHBzOlwvXC9mYi5tZVwvNzVnT3RQOU54XG5cblpvYmFjenlcdTAxNDJlbShhbSkgdG8gbmEgRmFjZWJvb2t1Li4uIiwiYXBwIjoiZmFjZWJvb2sifQ.VOUbQYw_tjJTvYuC7kGb1Jr-GCK9QWPzizccDnSlolgjSDhyLFdnrZjNEFMYdVhTFb9Fx-lKWT_b725bLbdOrQ&fbclid=IwcGRvZgFleHRuA2FlbQIxMABicmlkETBNS1lzejdEUkNadTlkYzk0c3J0YwZhcHBfaWQQMjIyMDM5MTc4ODIwMDg5MgABHgCbMbMv6tPkEHOKBdTEK67Zuq8kJo44mUU85tMFl52Jf38VioLWWXugpsv2_aem_zkUAdU8XJ-PelfcFLQQMIw)


